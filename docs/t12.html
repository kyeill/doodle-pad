<!doctype html>
<!-- TEST PAGE, generated from index.html; delete when the tablet issue is solved -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e4">
<meta name="mobile-web-app-capable" content="yes">
<title>Doodle Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <nav id="tools" class="rail" aria-label="Tools">
    <button class="tool on" data-tool="marker" aria-label="Marker">
      <svg viewBox="0 0 64 64"><g transform="rotate(40 32 32)" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
        <path d="M26 20 L29 8 h6 L38 20 Z" fill="var(--ink)"/>
        <rect x="23" y="20" width="18" height="36" rx="5" fill="#fff"/>
        <rect x="23" y="20" width="18" height="10" fill="var(--ink)"/>
      </g></svg>
    </button>
    <button class="tool" data-tool="crayon" aria-label="Crayon">
      <svg viewBox="0 0 64 64"><g transform="rotate(40 32 32)" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
        <path d="M24 22 L32 5 L40 22 Z" fill="var(--ink)"/>
        <rect x="24" y="22" width="16" height="36" rx="2" fill="var(--ink)"/>
        <rect x="24" y="30" width="16" height="18" fill="#fff" fill-opacity=".85"/>
      </g></svg>
    </button>
    <button class="tool" data-tool="rainbow" aria-label="Rainbow">
      <svg viewBox="0 0 64 64" fill="none" stroke-width="7" stroke-linecap="round">
        <path d="M9 48 a23 23 0 0 1 46 0" stroke="#ef476f"/>
        <path d="M17 48 a15 15 0 0 1 30 0" stroke="#ffc233"/>
        <path d="M25 48 a7 7 0 0 1 14 0" stroke="#3a86ff"/>
      </svg>
    </button>
    <button class="tool" data-tool="stars" aria-label="Stars">
      <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round" fill="var(--ink)">
        <path d="M29 15 L34.3 27.7 L48 28.8 L37.6 37.8 L40.8 51.2 L29 44 L17.2 51.2 L20.4 37.8 L10 28.8 L23.7 27.7 Z"/>
        <path d="M50 6 L52.1 11.1 L57.6 11.5 L53.4 15.1 L54.7 20.5 L50 17.6 L45.3 20.5 L46.6 15.1 L42.4 11.5 L47.9 11.1 Z"/>
      </svg>
    </button>
    <button class="tool" data-tool="stickers" aria-label="Stickers">
      <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
        <path d="M14 8 h36 a4 4 0 0 1 4 4 v26 l-18 18 h-22 a4 4 0 0 1 -4 -4 v-40 a4 4 0 0 1 4 -4 Z" fill="#fff"/>
        <path d="M54 38 L36 56 L36 44 a6 6 0 0 1 6 -6 Z" fill="#ffe08a"/>
        <g fill="#f7902b" stroke="none">
          <ellipse cx="29" cy="35" rx="8" ry="6.5"/>
          <circle cx="19.5" cy="25" r="3.6"/><circle cx="25.5" cy="19" r="3.6"/>
          <circle cx="32.5" cy="19" r="3.6"/><circle cx="38.5" cy="25" r="3.6"/>
        </g>
      </svg>
    </button>
    <button class="tool" data-tool="fill" aria-label="Paint bucket">
      <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
        <g transform="rotate(-18 30 36)">
          <path d="M16 26 C16 9, 42 9, 42 26" fill="none"/>
          <path d="M14 26 h30 l-4 26 a4 4 0 0 1 -4 3.5 h-14 a4 4 0 0 1 -4 -3.5 Z" fill="#fff"/>
          <ellipse cx="29" cy="26" rx="15" ry="5" fill="var(--ink)"/>
        </g>
        <path d="M53 32 C57 39 59 42 59 46 a6 6 0 0 1 -12 0 C47 42 49 39 53 32 Z" fill="var(--ink)"/>
      </svg>
    </button>
    <button class="tool" data-tool="eraser" aria-label="Eraser">
      <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
        <g transform="rotate(-35 32 32)">
          <rect x="11" y="21" width="42" height="22" rx="5" fill="#fff"/>
          <path d="M11 26 a5 5 0 0 1 5 -5 h14 v22 h-14 a5 5 0 0 1 -5 -5 Z" fill="#ff8fab"/>
        </g>
      </svg>
    </button>
  </nav>

  <main id="stage"><canvas id="paper" width="0" height="0"></canvas></main>

  <aside id="side" class="rail">
    <div id="colors" aria-label="Colours"></div>
    <div id="stickers" aria-label="Stickers"></div>
    <div id="sizes" aria-label="Sizes">
      <button class="size" data-size="0" aria-label="Small"><i></i></button>
      <button class="size on" data-size="1" aria-label="Medium"><i></i></button>
      <button class="size" data-size="2" aria-label="Big"><i></i></button>
    </div>
    <div id="actions">
      <button class="act" id="undo" aria-label="Undo">
        <svg viewBox="0 0 64 64" fill="none" stroke="#3d3a4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 26 H38 a12 12 0 0 1 0 24 H26"/><path d="M28 16 L18 26 L28 36"/>
        </svg>
      </button>
      <button class="act" id="open-gallery" aria-label="Pictures">
        <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
          <rect x="18" y="10" width="38" height="30" rx="4" fill="#ffe08a"/>
          <rect x="8" y="22" width="38" height="30" rx="4" fill="#fff"/>
          <path d="M12 48 L22 36 L29 44 L34 39 L42 48 Z" fill="#8ac926" stroke-width="2.5"/>
          <circle cx="37" cy="30" r="4" fill="#ffb703" stroke-width="2.5"/>
        </svg>
      </button>
      <button class="act hold wide" id="new-page" aria-label="New page (hold)">
        <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="3" stroke-linejoin="round">
          <path d="M16 7 h22 l10 10 v40 h-32 Z" fill="#fff"/><path d="M38 7 v10 h10" fill="none"/>
          <path d="M32 27 v20 M22 37 h20" stroke="#ff7a59" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </aside>
</div>

<section id="gallery" hidden aria-label="Pictures">
  <header>
    <button class="act" id="close-gallery" aria-label="Back">
      <svg viewBox="0 0 64 64" fill="none" stroke="#3d3a4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M40 14 L22 32 L40 50"/></svg>
    </button>
    <h1>Pictures</h1>
    <span id="version"></span>
  </header>
  <div id="grid"></div>
  <p id="empty" hidden>No pictures yet. Every page you draw is kept here automatically.</p>
</section>

<template id="card-tpl">
  <figure class="card">
    <img alt="">
    <button class="mini share" aria-label="Share or save">
      <svg viewBox="0 0 64 64" fill="none" stroke="#3d3a4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 v30 M21 19 l11 -11 l11 11"/><path d="M14 32 v20 h36 v-20"/></svg>
    </button>
    <button class="mini del hold" aria-label="Delete (hold)">
      <svg viewBox="0 0 64 64" stroke="#3d3a4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18 h36 M26 18 v-6 h12 v6" fill="none"/><path d="M19 18 l3 34 h20 l3 -34" fill="#fff"/></svg>
    </button>
  </figure>
</template>

<script>window.DOODLE_TEST = { stopAt: 'pickers' };</script>
<script src="stickers.js"></script>
<script src="app.js"></script>
</body>
</html>
